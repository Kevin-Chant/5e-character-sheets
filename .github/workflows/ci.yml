name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint, type-check and test have no dependency on each other, so they run as
# three concurrent jobs rather than as one sequential `pnpm run ci` step. That
# trades runner minutes (each job pays its own checkout and install) for
# wall-clock: the run now finishes with its slowest step instead of with the sum
# of all three.
#
# `pnpm run ci` still exists and still runs all three in sequence — it's the
# local pre-push check, where one terminal and one node_modules make sequential
# the right shape.
jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      # One failing check shouldn't cancel the others: a type error and a failing
      # test are different problems, and seeing both in one run beats fixing one
      # to discover the next.
      fail-fast: false
      matrix:
        # Every check `pnpm run ci` runs locally, including schema:check —
        # which verifies src/schema.json was regenerated after a change to the
        # Character model, and is easy to forget when splitting these out.
        task: [schema:check, lint:ci, type-check, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.task }}
        run: pnpm run ${{ matrix.task }}
